services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # ภายใน container คำว่า localhost คือตัว container เอง ไม่ใช่เครื่องเรา
      # จึงต้องชี้ไปที่ host.docker.internal เพื่อคุยกับ MongoDB ที่รันอยู่บนเครื่อง
      MONGODB_URI: mongodb://pukthong_admin:change_me_in_local_env@host.docker.internal:27017/pukthong?authSource=admin
      # ตรึงไว้ให้ตรงกับ volume ด้านล่าง ไม่ว่า .env จะตั้ง UPLOAD_DIR เป็นอะไร
      # (ค่าใน environment ชนะค่าใน env_file เสมอ)
      UPLOAD_DIR: /data/uploads
    extra_hosts:
      # Linux ไม่มี host.docker.internal ให้เองเหมือน Docker Desktop
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app          # hot reload ตอน dev
      - /app/node_modules       # ใช้ของที่ติดตั้งใน image ไม่ให้โฟลเดอร์ในเครื่องทับ
      - uploads:/data/uploads   # รูปใบเสร็จต้องอยู่รอดหลัง restart
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    # ไม่ตั้ง VITE_API_BASE แล้ว — frontend เดาที่อยู่ backend จาก host ที่ browser
    # เปิดอยู่เอง (ดู frontend/src/api.ts) จึงถูกทั้งตอนเปิด localhost และเปิดจากมือถือ
    # และไม่พังอีกเวลาเราเตอร์แจก IP ใหม่ให้เครื่อง
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  uploads:
  web_node_modules:
